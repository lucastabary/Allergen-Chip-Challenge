[project]
name = "acc"
version = "0.1.0"
description = "Profiling allergy severity factors on the Allergen Chip Challenge (ACC) database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "xlrd>=2.0",
]

[project.scripts]
acc-download = "acc.data:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
